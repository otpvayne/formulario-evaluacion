<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario Evaluación</title>
  
  <!-- Vincular Tailwind CSS desde CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center">Formulario de contacto</h1>
    
    <form id="formulario">
      <div class="mb-4">
        <label for="nombre" class="block text-gray-700 font-bold mb-2">Nombre</label>
        <input type="text" id="nombre" name="nombre" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500 hover:border-blue-400 transition-all duration-300 focus:outline focus:outline-blue-300 transition duration-300 transform hover:scale-105" />
      </div>
      
      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-bold mb-2">Email</label>
        <input type="email" id="email" name="email" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500 hover:border-blue-400 transition-all duration-300focus:outline focus:outline-blue-300 transition duration-300 transform hover:scale-105" />
      </div>
      
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full transition duration-300 transform hover:scale-105">
  Enviar
</button>

    </form>
    
    <p id="mensaje" class="mt-4 text-sm text-green-600 hidden">¡Formulario enviado correctamente!</p>
  </div>

  <!-- Enlazar tu script JS -->
  <script src="main.js"></script>
</body>
</html>
